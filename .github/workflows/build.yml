name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: npm i -g esbuild typescript
      - run: |
          sudo curl -sSfL -o /usr/local/bin/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/latest/download/tailwindcss-linux-x64
          sudo chmod +x /usr/local/bin/tailwindcss
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build
