<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<title>Log in - xioioi</title>
		<link rel="stylesheet" href="/static/css/app.css">
	</head>
	<body>
		%%navbar%%
		<main class="flex items-start justify-center">
			<div class="card mt-12 w-full max-w-sm">
				<div class="card-body">
					<h1 class="text-center">Log in</h1>
					%%error%%
					<form method="post" action="/login">
						<div class="mb-3">
							<label for="name" class="form-label">Login</label>
							<input id="name" name="name" type="text" value="%%name%%" autocomplete="username" required autofocus class="form-control">
						</div>
						<div class="mb-4">
							<label for="password" class="form-label">Password</label>
							<input id="password" name="password" type="password" autocomplete="current-password" required class="form-control">
						</div>
						<button type="submit" class="btn btn-primary w-full">Log in</button>
					</form>
				</div>
			</div>
		</main>
		%%footer%%
	</body>
</html>
