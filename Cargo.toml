[package]
name = "xioioi"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
getrandom = "0.4.3"
markdown = "1.0.0"
rust-embed = { version = "8.12.0", features = ["mime-guess"] }
scrypt = { version = "0.12.0", default-features = false, features = ["phc"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
tokio = { version = "1", features = ["full"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
